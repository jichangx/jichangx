name: 每日同步精品聚合页

on:
  schedule:
    # UTC 17:00 = 北京时间 1:00,在免费节点(0:00)与机场推荐清单(0:30)更新之后
    - cron: '0 17 * * *'
  workflow_dispatch: {} # 允许在 Actions 页手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 生成 README
        run: node scripts/build-readme.mjs

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "无变化,跳过提交"
          else
            git commit -m "每日同步精品聚合页 $(date -u +%Y-%m-%d)"
            git push
          fi
